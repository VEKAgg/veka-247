# ffplayout.yml
# Main ffplayout configuration for veka-247 rta branch
# Replaces config/stream.conf from dev branch
# Docs: https://ffplayout.github.io

global:
  log_level: "warning"
  log_path: "/opt/247live/logs/ffplayout/ffplayout.log"
  log_to_file: true
  stat_file: "/opt/247live/logs/ffplayout/stats.json"

processing:
  # Video output spec -- matches 720p30 quality profile from dev/config/stream.conf
  width: 1280
  height: 720
  fps: 30
  add_logo: false
  logo: ""
  logo_scale: ""
  logo_opacity: 1
  logo_filter: "overlay=W-w-12:12"
  add_loudnorm: false
  loud_i: -18
  loud_tp: -1.5
  loud_lra: 11
  # Matches vf filter from dev/scripts/playout.sh
  # Scale + pad to 1280x720 with black bars, normalize fps and pixel format
  custom_filter: "scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2:color=black,fps=30,format=yuv420p"

ingest:
  enable: false

playlist:
  # folder mode: ffplayout reads directly from /srv/clips (TrueNAS NFS)
  # No generate_playlist.sh needed -- ffplayout handles this internally
  mode: "folder"
  path: "/opt/247live/playlists"
  day_start: "00:00:00"
  length: "24:00:00"

storage:
  # TrueNAS NFS mount at 192.168.1.98:/srv/clips
  path: "/srv/clips"
  filler: ""
  extensions:
    - "mp4"
    - "mkv"
    - "mov"
    - "avi"
    - "flv"
    - "ts"
  shuffle: true  # random order, replaces shuf in generate_playlist.sh

text:
  # Disabled for now -- enable later for lower-thirds with clip name / submitter
  add_text: false
  over_pre: false
  bind_address: "127.0.0.1:5555"
  fontfile: "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
  text_from_filename: false
  style: "FontSize=24,PrimaryColour=&Hffffff,BackColour=&H80000000,BorderStyle=4"
  regex: "^.+[/\\\\](.+?)(_\\d+)*\\.\\w+$"

task:
  enable: false
  path: "/usr/bin/task"

out:
  # ffplayout pushes a single encoded RTMP stream to the local Restreamer container
  # Restreamer runs in Docker and fans out to Twitch / YouTube / Kick via its web UI
  # This avoids re-encoding per platform and keeps CPU usage low
  mode: "stream"
  output: >-
    -c:v libx264
    -preset superfast
    -profile:v high
    -b:v 2500k
    -maxrate 2500k
    -bufsize 5000k
    -g 60
    -keyint_min 60
    -r 30
    -pix_fmt yuv420p
    -c:a aac
    -b:a 128k
    -ar 44100
    -f flv
    rtmp://127.0.0.1:1935/live/247live
