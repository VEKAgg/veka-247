# ─── 247live Stream Configuration ────────────────────────────────────────────
# All scripts source this file. Change values here; never edit scripts directly.

# ── Paths ──────────────────────────────────────────────────────────────────────
CLIP_DIR="/srv/clips"
PLAYLIST="/tmp/247live-playlist.txt"
INSTALL_DIR="/opt/247live"
OVERLAY_FILE="/opt/247live/overlays/overlay.png"
FFMPEG_PID_FILE="/run/247live/ffmpeg.pid"
LOG_TAG="247live"

# ── Quality profile ────────────────────────────────────────────────────────────
# "720p30"  — 1280×720 @ 30fps, 2500 kbps  (recommended for most setups)
# "1080p60" — 1920×1080 @ 60fps, 6000 kbps (requires Twitch Partner/Affiliate)
QUALITY_PROFILE="720p30"

# ── Clip validation ────────────────────────────────────────────────────────────
# Run ffprobe on each clip before adding it to the playlist.
# Skips corrupt files and catches NFS stale handles early.
# Set to false if you have thousands of clips and generation is too slow.
VALIDATE_CLIPS=true

# ── RTMP endpoints ─────────────────────────────────────────────────────────────
TWITCH_RTMP="rtmp://live.twitch.tv/app"
YOUTUBE_RTMP="rtmp://a.rtmp.youtube.com/live2"
KICK_RTMP="rtmp://fa723fc1b171.global-contribute.live-video.net/app"

# ── Behavior ───────────────────────────────────────────────────────────────────
RESTART_DELAY=3
PLAYLIST_MIN_CLIPS=1
